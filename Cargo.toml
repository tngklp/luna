[workspace]
resolver = "2"
members = ["crates/luna-core", "crates/luna-tui"]
# The Tauri app is built by its own toolchain (tauri-cli), which expects to own
# its target directory and profile settings.
exclude = ["gui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/tngklp/luna"
homepage = "https://github.com/tngklp/luna"
authors = ["tngklp <tngklp@users.noreply.github.com>"]

[workspace.dependencies]
luna-core = { path = "crates/luna-core", version = "0.1.0" }

anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
crossterm = "0.28"
directories = "5"
futures-util = "0.3"
glob = "0.3"
ignore = "0.4"
mimalloc = { version = "0.1", default-features = false }
once_cell = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
