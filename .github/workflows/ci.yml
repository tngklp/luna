name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Stage placeholder sidecar (tauri build script requires it)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/luna-gui/binaries | Out-Null
          $ext = if ("${{ runner.os }}" -eq "Windows") { ".exe" } else { "" }
          $arch = if ("${{ runner.os }}" -eq "macOS" -and "${{ matrix.os }}" -like "*arm*") { "aarch64" } else { "x86_64" }
          $os_tag = switch ("${{ runner.os }}") { "Linux" { "unknown-linux-gnu" } "macOS" { "apple-darwin" } "Windows" { "pc-windows-msvc" } }
          $p = "crates/luna-gui/binaries/luna-$arch-$os_tag$ext"
          if (-not (Test-Path $p)) { Set-Content -Path $p -Value "" -NoNewline }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
