name: Release

# Manual only. A release is a deliberate act: pick the version, and the workflow
# tags the commit, builds every artifact, and publishes the notes from
# CHANGELOG.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 (a leading v is optional)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create the release as a draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Validate the version and pull its notes before anything expensive runs, so a
  # typo fails in seconds instead of after a full build.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize the version
        id: version
        run: |
          set -euo pipefail
          raw="${{ inputs.version }}"
          version="${raw#v}"
          version="${version#V}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$raw' is not a version like 0.1.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Read the release notes
        id: notes
        run: |
          set -euo pipefail
          notes=$(node scripts/changelog.mjs "${{ steps.version.outputs.version }}")
          # A multi-line value has to go through a delimiter.
          {
            echo 'notes<<LUNA_NOTES_EOF'
            echo "$notes"
            echo 'LUNA_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing tag
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; bump the version instead"
            exit 1
          fi

  # The TUI archives are what install.ps1 and install.sh download.
  tui:
    name: TUI (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release -p luna-tui --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="luna-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/luna" "dist/$name/"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "luna-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/luna.exe" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force
          Remove-Item -Recurse -Force "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The desktop app: NSIS + MSI on Windows, deb + AppImage on Linux, dmg on macOS.
  #
  # macOS builds one dmg per architecture rather than a universal binary: Tauri
  # resolves a sidecar as `<name>-<target>`, and `luna-universal-apple-darwin`
  # cannot exist, so a universal build would fail to find the TUI.
  gui:
    name: GUI (${{ matrix.os }} ${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'gui/src-tauri -> target'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        working-directory: gui
        run: npm ci

      - name: Generate icon manifests
        working-directory: gui
        run: |
          node ../scripts/sync-material-icons.mjs
          node ../scripts/sync-catppuccin-icons.mjs

      # The installer ships the TUI as a sidecar, so it has to exist first, and
      # it must be built for the same target the bundle is for.
      - name: Build the TUI sidecar
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p luna-tui --target ${{ matrix.target }}
          node scripts/stage-tui.mjs --triple ${{ matrix.target }}

      # The release is created once, by the publish job. Building directly (rather
      # than through tauri-action) keeps this job from ever touching releases.
      - name: Build the app
        working-directory: gui
        run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.target }}
          path: |
            gui/src-tauri/target/**/release/bundle/nsis/*.exe
            gui/src-tauri/target/**/release/bundle/msi/*.msi
            gui/src-tauri/target/**/release/bundle/deb/*.deb
            gui/src-tauri/target/**/release/bundle/appimage/*.AppImage
            gui/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # One job creates the release and attaches everything, so the notes come from
  # the changelog and the tag is created exactly once.
  publish:
    name: Publish
    needs: [prepare, tui, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          # Only the TUI archives are checksummed: the install scripts verify
          # those, and the native installers carry their own signatures.
          sha256sum luna-*.tar.gz luna-*.zip > checksums.txt
          cat checksums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          set -euo pipefail
          # The install scripts and the app both read this footer, so it is
          # appended to the changelog rather than replacing it.
          {
            printf '%s\n\n' "$NOTES"
            printf -- '---\n\n'
            printf '**Desktop app** — download the installer for your platform below. '
            printf 'It installs both the GUI and the `luna` terminal command.\n\n'
            printf '**Terminal only** — run the installer script:\n\n'
            printf '```powershell\n'
            printf 'irm https://raw.githubusercontent.com/tngklp/luna/main/install.ps1 | iex\n'
            printf '```\n\n'
            printf '```sh\n'
            printf 'curl -fsSL https://raw.githubusercontent.com/tngklp/luna/main/install.sh | sh\n'
            printf '```\n'
          } > release-notes.md

          flags=(--title "Luna $VERSION" --notes-file release-notes.md)
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          if [ "${{ inputs.draft }}" = "true" ]; then flags+=(--draft); fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            "${flags[@]}" \
            artifacts/*

      - name: Summary
        run: |
          {
            echo "### Released ${{ needs.prepare.outputs.tag }}"
            echo
            echo "https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
